<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>唛头生成器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#182230;background:#f2f5f8}*{box-sizing:border-box}body{margin:0;padding:28px 14px}.app{max-width:1100px;margin:auto;background:white;border-radius:18px;box-shadow:0 12px 40px #1b2b3a18;overflow:hidden}.head{padding:24px 32px;background:#12314a;color:#fff}.head h1{margin:0 0 5px}.head p{margin:0;color:#d4e0e8}.toolbar,.actions{display:flex;gap:10px;padding:18px 28px;flex-wrap:wrap}.toolbar{border-bottom:1px solid #e1e6ea}.pages{padding:0 28px 12px}.page{border:1px solid #dce2e8;border-radius:13px;margin:20px 0;padding:18px;background:#fbfcfd}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-weight:700}.pagehead button{border:0;background:#fbe9e8;color:#a32e2e;border-radius:7px;padding:7px 12px;cursor:pointer}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field{margin-bottom:13px}label{display:block;font-weight:650;margin-bottom:6px}input{width:100%;border:1px solid #ccd5df;border-radius:8px;padding:10px;font:inherit}.upload{border:2px dashed #bdc8d4;border-radius:11px;padding:12px;text-align:center;color:#607080;transition:.15s}.upload.dragover{border-color:#17699c;background:#edf7fc}.upload input{border:0;padding:5px}.preview{height:165px;margin-top:8px;background:#f3f6f8;border-radius:9px;display:grid;place-items:center;overflow:hidden}.preview img{max-width:100%;max-height:100%;object-fit:contain}.paper{background:white;padding:12px;border:1px solid #d4dce3;border-radius:10px}.paper h2{text-align:center;letter-spacing:3px;margin:3px 0 9px;font-size:17px}.mark{aspect-ratio:1.414;border:2px solid #19242d;padding:4%;display:flex;gap:4%;align-items:stretch}.details{width:52%;display:flex;flex-direction:column;justify-content:space-around;min-width:0}.row{border-bottom:1px solid #ccd2d8;padding-bottom:5px;overflow-wrap:anywhere}.row small{display:block;color:#697785;font-size:9px;font-weight:bold;margin-bottom:3px}.row strong{font-size:clamp(12px,1.7vw,17px);white-space:pre-wrap}.productpic{width:44%;min-width:0;min-height:0;aspect-ratio:1.12;border:1px solid #bbc4cc;display:grid;place-items:center;overflow:hidden;color:#8995a0;font-size:12px;text-align:center;background:#fafbfc}.productpic img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center}.actions button,.toolbar button{border:0;border-radius:8px;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#17699c;color:white}.secondary{background:#edf1f4;color:#344455}.tip{font-size:13px;color:#647383;padding:0 28px 20px}.mark.export{width:960px;height:679px;min-height:0;aspect-ratio:auto;border-radius:0;padding:38px;gap:34px}.mark.export .details{width:52%}.mark.export .productpic{width:44%;height:auto;align-self:stretch}.mark.export .productpic img{width:auto;height:auto;max-width:100%;max-height:100%}.mark.export .row{padding-bottom:12px}.mark.export .row small{font-size:18px}.mark.export .row strong{font-size:30px}.export-shell{position:fixed;left:-12000px;top:0;width:1040px;background:white;padding:40px}.export-shell h2{text-align:center;font: bold 34px Arial,sans-serif;letter-spacing:4px;margin:0 0 20px}.actions{padding-top:0}@media(max-width:700px){.layout{grid-template-columns:1fr}.head{padding:20px}.pages{padding:0 14px}.toolbar,.actions{padding:14px}.mark{min-height:300px}}
</style></head><body><main class="app"><header class="head"><h1>唛头生成器</h1><p>可添加多页唛头；每页可单独编辑文字和图片</p></header><div class="toolbar"><button class="secondary" id="addPage">＋ 添加新页</button><button class="secondary" id="duplicatePage">复制当前页</button></div><section class="pages" id="pages"></section><div class="actions"><button class="primary" id="download">导出多页 PDF</button></div><p class="tip">图片支持选择、拖拽或复制图片后在对应页面按 Ctrl+V 粘贴。PDF 通过浏览器渲染页面图像，支持中文显示；需要联网加载导出组件。</p></main>
<script>
const pages=document.getElementById('pages');let serial=0,current=null;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addPage(data={}){const id=++serial,el=document.createElement('article');el.className='page';el.dataset.id=id;el.innerHTML=`<div class="pagehead"><span>第 ${id} 页</span><button class="remove">删除此页</button></div><div class="layout"><div>${[['customer','客户名字','例如：ABC TRADING'],['product','产品名称','GYM TURF'],['color','COLOR','BLACK WITH MARK'],['size','尺寸','例如：60 × 40 × 35 cm'],['qty','件数','例如：12 PCS / CTN']].map(([k,l,p])=>`<div class="field"><label>${l}</label><input data-field="${k}" placeholder="${p}" value="${escapeHtml(data[k]??(k==='product'?'GYM TURF':(k==='color'?'BLACK WITH MARK':'')))}"></div>`).join('')}<div class="upload"><label>产品图片（可选）</label><input type="file" accept="image/*"><div class="filename">点击选择，或将图片拖到这里 / Ctrl+V 粘贴</div><div class="preview">图片预览</div></div></div><div class="paper"><h2>SHIPPING MARK</h2><div class="mark"><div class="details">${[['customer','CUSTOMER'],['product','PRODUCT'],['color','COLOR'],['size','MEAS'],['qty','QTY']].map(([k,l])=>`<div class="row"><small>${l}</small><strong data-preview="${k}">${k==='product'?'GYM TURF':(k==='color'?'BLACK WITH MARK':'—')}</strong></div>`).join('')}</div><div class="productpic">PRODUCT IMAGE</div></div></div></div>`;pages.append(el);current=el;
const update=()=>el.querySelectorAll('[data-preview]').forEach(n=>n.textContent=el.querySelector(`[data-field="${n.dataset.preview}"]`).value||'—');el.querySelectorAll('[data-field]').forEach(x=>x.addEventListener('input',update));update();
function imageFile(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{el.dataset.image=reader.result;el.querySelector('.filename').textContent=file.name||'已粘贴图片';el.querySelector('.preview').innerHTML=`<img src="${reader.result}">`;el.querySelector('.productpic').innerHTML=`<img src="${reader.result}">`};reader.readAsDataURL(file)}el.querySelector('input[type=file]').onchange=e=>imageFile(e.target.files[0]);const drop=el.querySelector('.upload');for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('dragover')});for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('dragover')});drop.addEventListener('drop',e=>imageFile(e.dataTransfer.files[0]));el.addEventListener('click',()=>current=el);el.querySelector('.remove').onclick=()=>{if(pages.children.length===1){alert('至少保留一页。');return}el.remove();current=pages.lastElementChild;renumber()};return el}
function renumber(){[...pages.children].forEach((p,i)=>p.querySelector('.pagehead span').textContent=`第 ${i+1} 页`)}
addPage();document.getElementById('addPage').onclick=()=>addPage();document.getElementById('duplicatePage').onclick=()=>{const first=pages.firstElementChild;if(!first)return;const d=Object.fromEntries([...first.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.value]));const image=first.dataset.image;const filename=first.querySelector('.filename').textContent;const n=addPage(d);if(image){n.dataset.image=image;n.querySelector('.filename').textContent=filename;n.querySelector('.preview').innerHTML=`<img src="${image}">`;n.querySelector('.productpic').innerHTML=`<img src="${image}">`}};
pages.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(item){e.preventDefault();const target=e.target.closest('.page')||current;if(target){const file=item.getAsFile();const reader=new FileReader();reader.onload=()=>{target.dataset.image=reader.result;target.querySelector('.filename').textContent='已粘贴图片';target.querySelector('.preview').innerHTML=`<img src="${reader.result}">`;target.querySelector('.productpic').innerHTML=`<img src="${reader.result}">`};reader.readAsDataURL(file)}}});
document.getElementById('download').onclick=async()=>{if(!window.jspdf||!window.html2canvas){alert('PDF 组件暂时无法加载，请检查网络后刷新。');return}const name=prompt('请输入 PDF 文件名：','唛头');if(name===null)return;const safe=name.trim().replace(/[\\/:*?"<>|]/g,'_').replace(/\.pdf$/i,'');if(!safe){alert('文件名不能为空。');return}const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),shell=document.createElement('div');shell.className='export-shell';document.body.append(shell);try{for(let i=0;i<pages.children.length;i++){const p=pages.children[i],vals=[...p.querySelectorAll('[data-field]')];if(vals.some(x=>!x.value.trim())){alert(`请完成第 ${i+1} 页的所有文字信息。`);return}const mark=p.querySelector('.mark').cloneNode(true);mark.classList.add('export');const heading=document.createElement('h2');heading.textContent='SHIPPING MARK';shell.append(heading,mark);if(p.dataset.image)mark.querySelector('.productpic').innerHTML=`<img src="${p.dataset.image}">`;await new Promise(r=>setTimeout(r,80));const canvas=await html2canvas(shell,{scale:2,backgroundColor:'#ffffff'});if(i>0)pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',0,0,297,210);shell.innerHTML=''}}catch(err){alert('PDF 生成失败，请重试。')}finally{shell.remove()}pdf.save(safe+'.pdf')};
</script></body></html>
